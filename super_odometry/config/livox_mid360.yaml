/**:
  ros__parameters:
    imu_topic: "/livox/imu"
    laser_topic: "/livox/lidar"
    sensor: "livox"
    use_imu_roll_pitch: false

    world_frame: "map"
    world_frame_rot: "map_rot"
    sensor_frame: "sensor"
    sensor_frame_rot: "sensor_rot"

    imu_acc_x_limit: 0.5
    imu_acc_y_limit: 0.2
    imu_acc_z_limit: 0.4

    # Feature Extraction Params
    feature_extraction_node:
        scan_line: 4 
        min_range: 0.2    #<!-- remove too closed points -->
        filter_point_size: 3

    # Laser Mapping Params
    laser_mapping_node:
        mapping_line_resolution: 0.1
        mapping_plane_resolution: 0.1
        max_iterations: 5
        max_surface_features: 4000

        # For localization mode
        localization_mode: false
        read_pose_file: false
        init_x: 0.0
        init_y: 0.0
        init_z: 0.0
        init_roll: 0.0
        init_pitch: 0.0
        init_yaw: 0.0 

    # IMU Preintegration Params
    imu_preintegration_node:
        lidar_correction_noise: 0.01
        
        acc_n: 9.81e-04          # accelerometer measurement noise standard deviation (100μg/√Hz * 9.81 = 9.81e-4 m/s²/√Hz)
        gyr_n: 7.854e-05         # gyroscope measurement noise standard deviation (4.5mdps/√Hz = 7.854e-5 rad/s/√Hz)
        acc_w: 1.5e-04           # accelerometer bias random walk noise standard deviation (≈0.15mg/°C stability)
        gyr_w: 1.0e-05           # gyroscope bias random walk noise standard deviation (≈10mdps/°C stability)
        g_norm: 9.80511    # 0 means you need to provide both imu-camera and laser-camera extrinsic

